schema_version: 1
tool_version: v1.2.0
tool_checksums_sha256: 7de6de3a14184eced8c0114bf802cb24a808f3e1592d358f6f6f3d02552d0e27

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt

operations:
  - module: .
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: conformance
        timeout: 20m
  - module: .
    gate: interoperability
    steps:
      - type: make
        makefile: verification/package.mk
        target: interoperability
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [./parse]
        fuzz: '^FuzzJSONParserDeterminism$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./parse]
        fuzz: '^FuzzYAMLParserProducesJSONSemantics$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./jsonvalue]
        fuzz: '^FuzzValueMarshalJSONWithLimits$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./jsonschema]
        fuzz: '^FuzzSchemaObjectCompilationAndEvaluation$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./media]
        fuzz: '^FuzzServerSentEventParsingDeterminism$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./internal/quality/cmd/mutationgate]
        fuzz: '^FuzzMutationReportDecoder$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./internal/specification/cmd/provenance]
        fuzz: '^FuzzProvenanceManifestDecoder$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./internal/specification/cmd/specmatrix]
        fuzz: '^FuzzSpecmatrixManifestDecoder$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./internal/modelgen/cmd/modelgen]
        fuzz: '^FuzzModelgenFieldInventoryDecoder$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./reference]
        fuzz: '^FuzzPointerCanonicalRoundTrip$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./reference]
        fuzz: '^FuzzFragmentClassificationIsStable$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./reference]
        fuzz: '^FuzzBundleInternalDocumentsIsIdentity$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./reference]
        fuzz: '^FuzzDereferenceObjectsIsDeterministic$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./reference]
        fuzz: '^FuzzFileResolverIdentifierBoundary$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./reference]
        fuzz: '^FuzzHTTPResolverResponseBoundary$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./expression]
        fuzz: '^FuzzRuntimeExpressionParse$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./expression]
        fuzz: '^FuzzRuntimeExpressionTemplateParse$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./parameter]
        fuzz: '^FuzzOpenAPI32QueryDecode$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./parameter]
        fuzz: '^FuzzSwagger20QueryDecode$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./diff]
        fuzz: '^FuzzOperationDiffDeterminism$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./compose]
        fuzz: '^FuzzFilterOperationsKeepAllIsIdentity$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./compose]
        fuzz: '^FuzzMergeIdenticalDocumentsIsIdentity$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./convert]
        fuzz: '^FuzzConvertPatchAndForwardVersions$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./convert]
        fuzz: '^FuzzConvertOpenAPI31To30$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./convert]
        fuzz: '^FuzzConvertOpenAPI30ToSwagger20$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./serialize]
        fuzz: '^FuzzJSONAndYAMLSemanticRoundTrip$'
        budget: 1000x
        timeout: 2m
      - type: go-test
        packages: [./validate]
        fuzz: '^FuzzDocumentValidationDeterminism$'
        budget: 1000x
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: make
        makefile: verification/package.mk
        target: performance
        timeout: 20m
