name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal for selected releasable modules
        required: false
        default: false
        type: boolean
      release_module:
        description: Rehearse one module directory; blank selects every releasable module
        required: false
        default: ''
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@a758b4d254e174d535a0dcda57918d7a7b8ad6b1 # reviewed security maintenance source
    with:
      tooling_sha: a758b4d254e174d535a0dcda57918d7a7b8ad6b1
      source_bootstrap: true
      public_dependencies: true
      release_dry_run: ${{ inputs.release_dry_run || false }}
      release_module: ${{ inputs.release_module || '' }}

  required:
    name: Required
    if: always()
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: test "${CI_RESULT}" = success
